[package]
name = "proofofseed-python"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Python bindings for the ProofofSeed prover/verifier (proofofseed-host), built with Maturin/PyO3."

[lib]
name = "_proofofseed"
crate-type = ["cdylib"]

[dependencies]
proofofseed-circuits = { version = "0.1.0" }
proofofseed-host = { version = "0.1.0" }
# Keccak-256 for the sidecar digests.
zkboo = { version = "1.3.0", default-features = false, features = ["u32", "u64"] }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }

[profile.release]
strip = "none"
